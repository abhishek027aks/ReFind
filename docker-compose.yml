services:
  api:
    build: .
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      REFIND_DATABASE_PATH: /data/refind.db
      REFIND_UPLOAD_DIR: /data/uploads
    volumes:
      - refind-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
      args:
        VITE_API_URL: http://localhost:8001
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  refind-data:
